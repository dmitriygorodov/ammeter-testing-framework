# Example non-emulated USB bench configuration.
ammeters:
  acme:
    transport: "usb"
    emulated: false
    # Replace these example identifiers with the real bench device values.
    vendor_id: 0x1234
    product_id: 0x5678
    serial_number: "BENCH-USB-001"
    interface_number: 0
    alternate_setting: 0
    read_endpoint_address: 0x81
    write_endpoint_address: 0x02
    max_response_bytes: 2048
    command: "READ_CURRENT"
