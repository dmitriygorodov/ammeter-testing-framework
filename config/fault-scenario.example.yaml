# Deterministic Phase 10 scenario: the first accepted request for each ammeter
# receives a +1000 A offset. Every response is still valid numeric evidence, so
# the configured acceptance policy produces FAIL rather than an execution error.
testing:
  sampling:
    measurements_count: 1
    total_duration_seconds: null
    sampling_frequency_hz: 5.0
  acceptance:
    policy_name: "simulated-overcurrent"
    policy_version: "1"
    limits:
      maximum_current_a: 100.0

communication:
  request_timeout_seconds: 1.0
  server_startup_timeout_seconds: 2.0
  server_shutdown_timeout_seconds: 2.0

ammeters:
  greenlee:
    transport: "tcp"
    emulated: true
    host: "127.0.0.1"
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    transport: "tcp"
    emulated: true
    host: "127.0.0.1"
    port: 5001
    command: "MEASURE_ENTES -get_data"
  circutor:
    transport: "tcp"
    emulated: true
    host: "127.0.0.1"
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"
  acme:
    transport: "usb"
    emulated: true
    # Replace these example identifiers with the real bench device values.
    vendor_id: 0x1234
    product_id: 0x5678
    serial_number: "ACM-USB-001"
    interface_number: 0
    alternate_setting: 0
    read_endpoint_address: 0x81
    write_endpoint_address: 0x02
    max_response_bytes: 2048
    command: "READ_CURRENT"

emulation:
  fault_injection:
    enabled: true
    ammeters:
      greenlee:
        - request_number: 1
          type: current_offset
          current_offset_a: 1000.0
      entes:
        - request_number: 1
          type: current_offset
          current_offset_a: 1000.0
      circutor:
        - request_number: 1
          type: current_offset
          current_offset_a: 1000.0
      acme:
        - request_number: 1
          type: current_offset
          current_offset_a: 1000.0
